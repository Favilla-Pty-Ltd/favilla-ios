# Builds the Favilla iPhone app on GitHub's macOS machines (no Mac needed).
#   Every push to main: an unsigned simulator build, to check it compiles.
#   Actions > iOS > Run workflow with "Upload to TestFlight" ticked: a signed
#   build uploaded to TestFlight. Needs these repository secrets:
#     APPLE_TEAM_ID   the 10-character Team ID (developer.apple.com > Account > Membership)
#     ASC_KEY_ID      App Store Connect API key ID
#     ASC_ISSUER_ID   App Store Connect API issuer ID
#     ASC_KEY_P8      the whole contents of the AuthKey_XXXX.p8 file
name: iOS
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight
        type: boolean
        default: false
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Test the profile-notes fix in bridge.js
        run: node Tests/profile_fix_test.js
      - name: Test CBOR and the passkey framing
        run: |
          swiftc -O Shared/CBOR.swift Shared/Ctap.swift Shared/AppChannel.swift Shared/KeyLink.swift Shared/KeySession.swift Shared/Bunker.swift Shared/VaultImport.swift Shared/NewPassword.swift Shared/CipherDay.swift App/VaultCourier.swift App/KeyApi.swift App/NostrLink.swift App/LinkLog.swift Tests/main.swift -o ctaptests
          ./ctaptests
      - name: Generate the project
        run: brew install xcodegen && xcodegen generate
      - name: Build (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Favilla.xcodeproj -scheme Favilla -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E "error:|\*\* BUILD" build.log | sort -u | head -n 80; exit 1; }
          grep -E "warning:.*\.swift|\*\* BUILD" build.log | sort -u | head -n 40
      - name: Check the bundled fonts (app and AutoFill extension)
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name Favilla.app -path "*Debug-iphonesimulator*" | head -1)
          echo "app: $APP"
          for f in Archivo-Light Archivo-Regular Archivo-SemiBold Archivo-Bold; do
            test -f "$APP/$f.ttf" || { echo "::error::$f.ttf missing from the app"; exit 1; }
            test -f "$APP/PlugIns/FavillaAutoFill.appex/$f.ttf" || { echo "::error::$f.ttf missing from the AutoFill extension"; exit 1; }
          done
          echo "fonts present in both"
      - name: Check the push test extension is embedded
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name Favilla.app -path "*Debug-iphonesimulator*" | head -1)
          test -d "$APP/PlugIns/FavillaPushProbe.appex" || { echo "::error::FavillaPushProbe.appex missing"; ls "$APP/PlugIns"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APP/PlugIns/FavillaPushProbe.appex/Info.plist"
      - name: Check the Nostr client is bundled
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name Favilla.app -path "*Debug-iphonesimulator*" | head -1)
          for f in pwa.html bridge.js; do test -f "$APP/$f" || { echo "::error::$f missing from the app"; exit 1; }; done
          grep -q 'data-pwa-build=' "$APP/pwa.html" && echo "pwa.html $(grep -o 'data-pwa-build="[0-9a-f]*"' "$APP/pwa.html" | head -1) and bridge.js present"
      - name: Screenshots of each shape (simulator, sample data)
        continue-on-error: true
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name Favilla.app -path "*Debug-iphonesimulator*" | head -1)
          DT=$(xcrun simctl list devicetypes | grep -E '^iPhone (17|16|15) \(' | head -1 | sed -E 's/.*\((.*)\)$/\1/')
          echo "device type: $DT"
          UDID=$(xcrun simctl create shots "$DT")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark || true
          xcrun simctl install "$UDID" "$APP"
          BID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          mkdir -p shots
          for m in unknown home-vault to-nostr vault vault-sheet vault-add vault-import settings-vault settings-nostr x-signin x-signin-name x-newpw-choose x-newpw-new x-newpw-asking x-newpw-done x-save-user x-save-asking x-wait-key x-waits x-pair-search x-pair-none nostr nostr-connect nostr-profile; do
            xcrun simctl launch --terminate-running-process "$UDID" "$BID" -FavillaDemo "$m"
            # The profile run opens a profile at 14 s and its fetch can take 13 s more.
            if [ "$m" = nostr-profile ]; then sleep 40; elif [ "$m" = nostr-profiles ]; then sleep 175; else sleep 10; fi
            xcrun simctl io "$UDID" screenshot "shots/$m.png"
          done
          # The app's own log lines from the sample runs (profile fetches among them).
          xcrun simctl spawn "$UDID" log show --last 6m --style compact --predicate 'eventMessage CONTAINS "FVLOG"' 2>/dev/null | sed -E 's/^.*FVLOG /FVLOG /' | tail -120 || true
          ls -la shots
          # The artifact store isn't reachable from every reader: the log carries
          # small JPEGs too, between markers.
          for f in shots/*.png; do
            sips -Z 1000 -s format jpeg -s formatOptions 70 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "SHOT-BEGIN $(basename "${f%.png}")"; base64 -i "${f%.png}.jpg" | tr -d '\n' | fold -w 2000; echo; echo "SHOT-END"
          done
      - name: Upload the screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots

  bridge:
    # The push bridge for relay.favillakey.io (server/push-bridge): Linux, cheap.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet websockets aiohttp "httpx[http2]" pyjwt cryptography
      - run: python3 server/push-bridge/test_bridge.py
      - run: bash -n server/push-bridge/favilla-push.sh

  testflight:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.upload
    runs-on: macos-latest
    env:
      DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets
        run: |
          for v in DEVELOPMENT_TEAM ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v (see the top of this file)"; exit 1; fi
          done
      - name: Newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Generate the project
        run: |
          # every TestFlight upload needs a higher build number: use the run number
          sed -i '' 's/CURRENT_PROJECT_VERSION: "1"/CURRENT_PROJECT_VERSION: "${{ github.run_number }}"/' project.yml
          grep -n CURRENT_PROJECT_VERSION project.yml
          brew install xcodegen && xcodegen generate
      - name: API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Revoke earlier CI signing certificates (Apple caps how many an account holds)
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography || python3 -m pip install --quiet pyjwt cryptography
          python3 .github/scripts/revoke_ci_dev_certs.py
      - name: Register any missing App IDs and capabilities (Xcode can't create new ones with the key)
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
        run: python3 .github/scripts/ensure_bundle_ids.py
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project Favilla.xcodeproj -scheme Favilla -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Favilla.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -n 80
      - name: Upload to TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Favilla.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 60
