# Send one test push to an iPhone running the Favilla TestFlight build (9 Nov 2026).
# The notification service extension (PushProbe) then tries to reach the KEY over
# Bluetooth and rewrites the notification with what happened.
#
# Needs the repository secrets APNS_KEY_P8 (the .p8 text of an Apple Push
# Notifications service key) and APNS_KEY_ID, plus APPLE_TEAM_ID (already used
# for signing). Runs on Linux (cheap). The push token is not secret.
#
#   gh api -X POST repos/Favilla-Pty-Ltd/favilla-ios/actions/workflows/push-test.yml/dispatches \
#     -f ref=main -f 'inputs[token]=<hex token>'
name: push-test
on:
  workflow_dispatch:
    inputs:
      token:
        description: "The iPhone's push token (Settings > This iPhone > Push test)"
        required: true
      environment:
        description: "production (TestFlight) or development"
        default: production
      body:
        description: "Notification text (replaced by the extension's result if it runs)"
        default: "Waiting for the KEY"

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TOKEN: ${{ inputs.token }}
      APNS_ENV: ${{ inputs.environment }}
      BODY: ${{ inputs.body }}
    steps:
      - name: Check the secrets are there
        run: |
          for v in APNS_KEY_P8 APNS_KEY_ID TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::$v is not set: add the APNs key as repository secrets APNS_KEY_P8 and APNS_KEY_ID"; exit 1; }
          done
          [[ "$TOKEN" =~ ^[0-9a-fA-F]{64,200}$ ]] || { echo "::error::the token should be hex"; exit 1; }
      - name: Send
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          JWT=$(python3 - <<'EOF'
          import os, time, jwt
          print(jwt.encode({"iss": os.environ["TEAM_ID"], "iat": int(time.time())},
                           os.environ["APNS_KEY_P8"], algorithm="ES256",
                           headers={"kid": os.environ["APNS_KEY_ID"]}))
          EOF
          )
          HOST=api.push.apple.com
          [ "$APNS_ENV" = development ] && HOST=api.sandbox.push.apple.com
          PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({"aps":{"alert":{"title":"Favilla test","body":os.environ["BODY"]},"mutable-content":1,"sound":"default"}}))')
          echo "sending to $HOST at $(date -u +%H:%M:%S) UTC"
          curl -sS --http2 -o resp.txt -w '%{http_code}' -D headers.txt \
            -H "authorization: bearer $JWT" \
            -H "apns-topic: io.favillakey.app" \
            -H "apns-push-type: alert" \
            -H "apns-priority: 10" \
            -H "apns-expiration: 0" \
            -d "$PAYLOAD" "https://$HOST/3/device/$TOKEN" > code.txt
          CODE=$(cat code.txt)
          echo "APNs answered HTTP $CODE $(grep -i '^apns-id' headers.txt | tr -d '\r')"
          cat resp.txt; echo
          [ "$CODE" = 200 ] || { echo "::error::APNs refused the push (HTTP $CODE): $(cat resp.txt)"; exit 1; }
