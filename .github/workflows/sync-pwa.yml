# Keep Nostr/pwa.html in step with the firmware repo's src/pwa.html (issue #26).
#
# The app serves its bundled copy of the KEY's PWA rather than pulling the
# shell from the KEY (2.5 MB, minutes over Bluetooth, and bridge.js is checked
# against a known build). So the copy is refreshed here: every few hours, and
# on demand, the firmware repo's main is read; when its PWA build id differs
# from the bundled one, pwa.html is replaced, committed, and a TestFlight
# build is dispatched.
#
# Needs the secret FIRMWARE_READ_TOKEN: a fine-grained personal access token
# with Contents: read on Favilla-Pty-Ltd/favilla-key-firmware (the default
# token can't read another private repository).

name: sync-pwa

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the firmware's pwa.html
        env:
          TOKEN: ${{ secrets.FIRMWARE_READ_TOKEN }}
        run: |
          set -e
          if [ -z "$TOKEN" ]; then echo "FIRMWARE_READ_TOKEN is not set"; exit 1; fi
          mkdir -p fw/src fw/scripts
          sha=$(curl -sS -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Favilla-Pty-Ltd/favilla-key-firmware/commits/main | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          curl -sS -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/Favilla-Pty-Ltd/favilla-key-firmware/contents/src/pwa.html?ref=$sha" -o fw/src/pwa.html
          echo "$sha" > fw/.sha
          test -s fw/src/pwa.html

      - name: Compare build ids and sync
        id: sync
        run: |
          set -e
          have=$(grep -o 'pwa build [0-9a-f]*' Nostr/PWA_SOURCE.txt | awk '{print $3}')
          want=$(grep -o 'data-pwa-build="[0-9a-f]*"' fw/src/pwa.html | head -1 | cut -d'"' -f2)
          echo "bundled $have, firmware $want"
          if [ -z "$want" ]; then echo "no build id in the firmware's pwa.html"; exit 1; fi
          if [ "$have" = "$want" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          cp fw/src/pwa.html Nostr/pwa.html
          sha=$(cat fw/.sha)
          printf 'Copied from Favilla-Pty-Ltd/favilla-key-firmware src/pwa.html\ncommit %s\npwa build %s\ncopied %s\nRefresh with scripts/sync_pwa.sh\n' \
            "$sha" "$want" "$(date -u +%Y-%m-%d)" > Nostr/PWA_SOURCE.txt
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo "$sha" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "build=$want" >> "$GITHUB_OUTPUT"

      - name: Commit and dispatch a TestFlight build
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "favilla-sync"
          git config user.email "sync@favillakey.io"
          git add Nostr/pwa.html Nostr/PWA_SOURCE.txt
          git commit -m "Nostr/pwa.html from firmware ${{ steps.sync.outputs.sha }} (PWA build ${{ steps.sync.outputs.build }}), automatic sync"
          git push
          gh api -X POST repos/${{ github.repository }}/actions/workflows/ios.yml/dispatches -f ref=main -F 'inputs[upload]=true'
