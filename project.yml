# XcodeGen spec for the Favilla iPhone app. The .xcodeproj is generated in CI
# (xcodegen generate) and never committed.
name: Favilla
options:
  bundleIdPrefix: io.favillakey
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.7.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Favilla:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Nostr          # the Nostr client: the KEY's PWA + bridge.js (NostrClientView)
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.favillakey.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Favilla
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [Archivo-Light.ttf, Archivo-Regular.ttf, Archivo-SemiBold.ttf, Archivo-Bold.ttf]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Portrait-only needs this or App Store Connect rejects the upload (90474).
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: Favilla uses Bluetooth to reach your Favilla KEY when you sign in.
        # The Nostr client (7 Nov 2026): the KEY on Wi-Fi, the pairing QR and calls.
        NSLocalNetworkUsageDescription: Favilla reaches your Favilla KEY on your Wi-Fi when the Nostr client is set to Wi-Fi.
        NSCameraUsageDescription: Favilla uses the camera to scan your Favilla KEY's pairing code and QR codes in Nostr, and for video calls.
        NSMicrophoneUsageDescription: Favilla uses the microphone for voice and video calls in Nostr.
        UIBackgroundModes: [audio, bluetooth-central, voip]   # a call keeps sounding; the KEY wakes the app for bunker requests (path B); calls ring (CallRing)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true    # the KEY's API is plain HTTP on the local network
        # iOS 26 credential exchange (issue #16): Apple Passwords > Export Data to
        # Another App opens Favilla with this activity (CredentialImport.swift). The
        # value is the first string; the second is the name Apple's docs give it.
        NSUserActivityTypes: [ASCredentialExchangeActivity, ASCredentialExchangeActivityType]
    entitlements:
      path: App/Favilla.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups: [group.io.favillakey.app]
        aps-environment: development   # push test (9 Nov 2026); the App Store export signs it as production
    dependencies:
      - target: FavillaAutoFill
      - target: FavillaPushProbe
  FavillaAutoFill:
    type: app-extension
    platform: iOS
    sources: [AutoFill, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.favillakey.app.autofill
    info:
      path: AutoFill/Info.plist
      properties:
        CFBundleDisplayName: Favilla
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [Archivo-Light.ttf, Archivo-Regular.ttf, Archivo-SemiBold.ttf, Archivo-Bold.ttf]
        NSBluetoothAlwaysUsageDescription: Favilla uses Bluetooth to reach your Favilla KEY when you sign in.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionShowsConfigurationUI: true
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true    # KEY drop 9a: passkeys over Bluetooth (BLE_PASSKEY_PROTOCOL.md)
              ProvidesOneTimeCodes: true    # KEY drop 9i: one-time codes (iOS 18 and later)
              SupportsCredentialExchange: true           # issue #16: listed in Apple Passwords > Export Data to Another App (iOS 26.4+)
              SupportedCredentialExchangeVersions: ["1.0"]
              SupportsGeneratePasswordCredentials: true      # issue #38: strong passwords made by the KEY (iOS 26.2+)
              SupportsGeneratePasswordCredentialsWithUI: false
              SupportsSavePasswordCredentials: true          # issue #38: iOS's save goes to the KEY with a held ENTER
              ProvidesTextToInsert: true                     # a retype box: AutoFill > Passwords > Favilla inserts the login just sent
    entitlements:
      path: AutoFill/FavillaAutoFill.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups: [group.io.favillakey.app]
  # The push test (9 Nov 2026): a notification service extension that tries to
  # reach the KEY over Bluetooth by itself when a push arrives (PushProbe/).
  FavillaPushProbe:
    type: app-extension
    platform: iOS
    sources:
      - PushProbe
      - path: Shared
        excludes: ["Fonts/**"]   # an extension has a 24 MB memory limit; no UI here
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.favillakey.app.pushprobe
    info:
      path: PushProbe/Info.plist
      properties:
        CFBundleDisplayName: Favilla
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: Favilla uses Bluetooth to reach your Favilla KEY when a request arrives.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: PushProbe/FavillaPushProbe.entitlements
      properties:
        com.apple.security.application-groups: [group.io.favillakey.app]
